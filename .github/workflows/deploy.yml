name: Deploy to Firebase

on:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Deploy Firestore rules
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COGNIFACE }}
        run: |
          echo "$SA_JSON" > /tmp/sa.json
          node -e "
          const https=require('https'),crypto=require('crypto'),fs=require('fs');
          const rules=fs.readFileSync('firestore.rules','utf8');
          const sa=JSON.parse(fs.readFileSync('/tmp/sa.json','utf8'));
          function jwt(){const h=Buffer.from(JSON.stringify({alg:'RS256',typ:'JWT'})).toString('base64url');const n=Math.floor(Date.now()/1000);const p=Buffer.from(JSON.stringify({iss:sa.client_email,sub:sa.client_email,aud:'https://oauth2.googleapis.com/token',iat:n,exp:n+3600,scope:'https://www.googleapis.com/auth/cloud-platform'})).toString('base64url');const s=crypto.createSign('RSA-SHA256');s.update(h+'.'+p);return h+'.'+p+'.'+s.sign(sa.private_key,'base64url')}
          function call(m,h,p,b,t){return new Promise((res,rej)=>{const d=b?JSON.stringify(b):null;const r=https.request({host:h,path:p,method:m,headers:{'Authorization':'Bearer '+t,'Content-Type':'application/json',...(d?{'Content-Length':Buffer.byteLength(d)}:{})}},resp=>{let x='';resp.on('data',c=>x+=c);resp.on('end',()=>res({s:resp.statusCode,b:x}))});r.on('error',rej);if(d)r.write(d);r.end()})}
          const td='grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion='+jwt();
          new Promise((res,rej)=>{const r=https.request({host:'oauth2.googleapis.com',path:'/token',method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','Content-Length':Buffer.byteLength(td)}},resp=>{let x='';resp.on('data',c=>x+=c);resp.on('end',()=>res(JSON.parse(x).access_token))});r.on('error',rej);r.write(td);r.end()}).then(async tok=>{const c=await call('POST','firebaserules.googleapis.com','/v1/projects/'+sa.project_id+'/rulesets',{source:{files:[{name:'firestore.rules',content:rules}]}},tok);if(c.s!==200){console.error('Create failed:',c.b);process.exit(1)}const rn=JSON.parse(c.b).name;const a=await call('PATCH','firebaserules.googleapis.com','/v1/projects/'+sa.project_id+'/releases/cloud.firestore',{release:{name:'projects/'+sa.project_id+'/releases/cloud.firestore',rulesetName:rn},updateMask:'rulesetName'},tok);if(a.s!==200){console.error('Apply failed:',a.b);process.exit(1)}console.log('Firestore rules deployed:',rn)}).catch(e=>{console.error(e);process.exit(1)});
          "

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COGNIFACE }}
          channelId: live
          projectId: cogniface
